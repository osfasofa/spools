<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spool — list client</title>
  <!-- T-020: the ugliest possible list client. Zero styling budget on purpose —
       this page proves the SDK, not the design. -->
</head>
<body>
  <h1>spool: <span id="code">…</span> · <span id="st">…</span></h1>
  <p>send this to a friend: <code id="share" style="word-break: break-all">…</code></p>
  <p>
    <label>your name: <input id="author"></label>
    <button id="saveAuthor">set name (reloads)</button>
    · <label><input type="checkbox" id="showDeleted"> show deleted</label>
  </p>
  <form id="windForm">
    <input id="body" placeholder="write something" autocomplete="off" size="40">
    <button>wind</button>
  </form>
  <ul id="list"></ul>
  <!-- classic scripts, not modules: modules don't load over file:// and this
       page must work from a USB stick. vendor/spools.js defines `spools`. -->
  <script src="vendor/spools.js"></script>
  <script src="app.js"></script>
</body>
</html>
