# Fly.io config for spools-relay. `fly launch --copy-config` from this
# directory, pick an app name, done. The broadcast half is stateless; the
# pocket (M10) is not — deposits are exactly somebody waiting, so give it a
# volume or accept that a restart empties the pocket (which degrades cleanly
# to sync-when-together, but during precisely the gaps the pocket bridges).
#
# With the volume: `fly volumes create pocket_data --size 1` first, and note
# scale-to-zero now trades pocket *latency* (cold wake on the next request),
# not correctness — deposits persist on the volume.
primary_region = "iad"

[env]
  POCKET_DIR = "/data/pocket"
  # Fly's proxy fronts every request, so the client is the rightmost
  # X-Forwarded-For hop, never the socket address (T-161)
  TRUST_PROXY = "1"

[[mounts]]
  source = "pocket_data"
  destination = "/data"

[http_service]
  internal_port = 4444
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
